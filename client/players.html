<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Players | osu! Auction</title>
  <link rel="stylesheet" href="css/homepage.css" />
</head>
<body>
  <div class="dashboard-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">o!</div>
        <span>osu! Auction</span>
      </div>
      <nav>
        <a href="/players.html">Players</a>
        <a href="#">Teams</a>
        <a href="/mappool.html">Mappool</a>
        <a href="#">Rules</a>
        <a id="admin-nav-link" href="/admin.html" class="nav-admin-link" hidden>Admin Panel</a>
      </nav>
      <div class="account-area">
        <div class="user-pill">
          <img id="dashboard-user-avatar" src="https://a.ppy.sh/1234567" alt="User avatar" />
          <div>
            <span id="dashboard-username">Player</span>
            <span id="user-role" class="user-role">Player</span>
          </div>
        </div>
        <a href="/logout" class="logout-link">Logout</a>
      </div>
    </header>

    <main class="dashboard-content">
      <section class="dashboard-heading" aria-labelledby="players-title">
        <div>
          <p class="eyebrow">Registered players</p>
          <h1 id="players-title">Players</h1>
        </div>
        <p id="players-count" class="timezone-note">Loading players</p>
      </section>

      <section id="players-directory" class="players-directory" aria-live="polite">
        <p class="empty-lineup">Loading registered players...</p>
      </section>
    </main>
  </div>

  <script>
    function createPlayerCard(player) {
      const card = document.createElement('article');
      card.className = 'player-directory-card panel';

      const avatar = document.createElement('img');
      avatar.className = 'directory-avatar';
      avatar.src = player.avatar_url || `https://a.ppy.sh/${player.user_id}`;
      avatar.alt = `${player.username} avatar`;

      const details = document.createElement('div');
      const name = document.createElement('h2');
      name.textContent = player.username;
      const role = document.createElement('p');
      role.textContent = player.role;
      const team = document.createElement('p');
      team.textContent = player.team_name || 'No team';
      details.append(name, role, team);
      card.append(avatar, details);
      return card;
    }

    async function loadPlayersPage() {
      const directory = document.getElementById('players-directory');
      const count = document.getElementById('players-count');

      try {
        const [userResponse, playersResponse] = await Promise.all([
          fetch('/api/user'),
          fetch('/api/players')
        ]);
        if (!userResponse.ok || !playersResponse.ok) {
          window.location.href = '/';
          return;
        }

        const [user, players] = await Promise.all([
          userResponse.json(),
          playersResponse.json()
        ]);
        document.getElementById('dashboard-username').textContent = user.username || 'Player';
        document.getElementById('user-role').textContent = (user.role || 'player')
          .replace(/^./, character => character.toUpperCase());
        if (user.avatar_url) document.getElementById('dashboard-user-avatar').src = user.avatar_url;
        document.getElementById('admin-nav-link').hidden = (user.role || '').toLowerCase() !== 'admin';

        count.textContent = `${players.length} registered`;
        directory.replaceChildren(...players.map(createPlayerCard));
        if (players.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'empty-lineup';
          empty.textContent = 'No players have registered yet.';
          directory.append(empty);
        }
      } catch (error) {
        console.error('Could not load players:', error);
        count.textContent = 'Unavailable';
        directory.replaceChildren();
        const errorMessage = document.createElement('p');
        errorMessage.className = 'empty-lineup';
        errorMessage.textContent = 'Players could not be loaded right now.';
        directory.append(errorMessage);
      }
    }

    loadPlayersPage();
  </script>
</body>
</html>
