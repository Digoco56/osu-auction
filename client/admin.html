<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Admin Panel - osu!Auction</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/admin-getusers.css">
</head>

<body>
    <h1>Admin Panel</h1>
    <section>
        <h2>Mappool visibility</h2>
        <p id="mappool-config-status"></p>
        <form id="mappool-config-form">
            <label for="mappool-sheets">Google Sheets tabs (one name per line)</label>
            <textarea id="mappool-sheets" rows="6" placeholder="qualifiers&#10;semifinals&#10;finals"></textarea>
            <button class="button" type="submit">Save tabs</button>
        </form>
        <div id="mappool-sections"></div>
    </section>
    <a class="button" href="/mappool.html">View mappool</a>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Avatar</th>
                <th>Role</th>
                <th>Change Role</th>
            </tr>
        </thead>
        <tbody id="user-table"></tbody>
    </table>

    <script src="js/admin-getusers.js"></script>
    <script src="js/admin-mappool.js"></script>

</body>

</html>
