<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teams | osu! Auction</title>
  <link rel="stylesheet" href="css/homepage.css" />
</head>

<body>
  <div class="dashboard-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">o!</div><span>osu! Auction</span>
      </div>
      <nav>
        <a href="/dashboard.html">Home</a><a href="/players.html">Players</a><a href="/teams.html">Teams</a><a
          href="/mappool.html">Mappool</a><a href="#">Rules</a>
        <a id="admin-nav-link" href="/admin.html" class="nav-admin-link" hidden>Admin Panel</a>
      </nav>
      <div class="account-area">
        <div class="user-pill"><img id="teams-user-avatar" src="https://a.ppy.sh/1234567" alt="User avatar">
          <div><span id="teams-username">Player</span><span id="teams-role" class="user-role">Player</span></div>
        </div><a href="/logout" class="logout-link">Logout</a>
      </div>
    </header>
    <main class="dashboard-content">
      <section class="dashboard-heading">
        <div>
          <p class="eyebrow">Tournament rosters</p>
          <h1>Teams</h1>
        </div>
        <p id="teams-count" class="timezone-note">Loading teams</p>
      </section>
      <section id="teams-directory" class="teams-directory" aria-live="polite">
        <p class="empty-lineup">Loading teams...</p>
      </section>
    </main>
  </div>
  <script src="js/teams.js"></script>
</body>

</html>
